services:
  db:
    image: postgres:16-alpine
    container_name: oes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oes_user
      POSTGRES_PASSWORD: ExamDb2026SafeKey2026
      POSTGRES_DB: oes_db
    ports:
      - "5433:5432"
    volumes:
      - oes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oes_user -d oes_db"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  oes_pgdata:
